services:
  - type: web
    name: dosti-khata
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: APP_PIN
        sync: false
      - key: APP_SECRET
        generateValue: true
